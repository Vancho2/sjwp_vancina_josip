<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt Forma</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .kontakt-forma {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #0d6efd;
            margin-bottom: 30px;
        }

        .btn-custom {
            background-color: #0d6efd;
            color: white;
            padding: 10px 25px;
            border-radius: 8px;
            border: none;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background-color: #084298;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="kontakt-forma">

            <h2>Kontaktirajte Nas</h2>

            <form method="GET">

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label for="ime" class="form-label">Ime i Prezime</label>
                        <input type="text" class="form-control" id="ime" name="ime" placeholder="Unesite ime">
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">Email adresa</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Unesite email">
                    </div>

                </div>

                <div class="mb-3">
                    <label for="poruka" class="form-label">Poruka</label>
                    <textarea class="form-control" id="poruka" name="poruka" rows="5" placeholder="Napišite poruku"></textarea>
                </div>

                <div class="mb-4">
                    <label for="datum" class="form-label">Odaberite datum</label>
                    <input type="date" class="form-control" id="datum" name="datum">
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-custom">
                        Pošalji Poruku
                    </button>
                </div>

            </form>

        </div>
    </div>

</body>
</html>
