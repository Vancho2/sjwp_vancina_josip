<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontaktirajte Nas</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"/>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0e0e0e;
      --card:      #161616;
      --border:    #2a2a2a;
      --accent:    #FDE68A;
      --accent2:   #d4a017;
      --text:      #e8e8e8;
      --muted:     #888;
      --radius:    12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* subtle grid texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(253,230,138,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(253,230,138,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .form-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
    }

    /* decorative corner accent */
    .form-wrapper::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px;
      width: 80px; height: 80px;
      border-top: 2px solid var(--accent);
      border-left: 2px solid var(--accent);
      border-radius: var(--radius) 0 0 0;
      pointer-events: none;
    }
    .form-wrapper::after {
      content: '';
      position: absolute;
      bottom: -2px; right: -2px;
      width: 80px; height: 80px;
      border-bottom: 2px solid var(--accent);
      border-right: 2px solid var(--accent);
      border-radius: 0 0 var(--radius) 0;
      pointer-events: none;
    }

    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 3.5rem;
    }

    .form-header {
      margin-bottom: 2.5rem;
    }

    .eyebrow {
      font-size: .7rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: .6rem;
    }

    .form-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }

    .form-title span {
      color: var(--accent);
    }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin-top: 1.1rem;
    }

    /* labels */
    .form-label {
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .45rem;
      font-weight: 400;
    }

    /* inputs */
    .form-control {
      background: #111;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      font-weight: 300;
      padding: .75rem 1rem;
      transition: border-color .2s, box-shadow .2s;
    }

    .form-control:focus {
      background: #111;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(253,230,138,.12);
      color: var(--text);
      outline: none;
    }

    .form-control::placeholder { color: #444; }

    textarea.form-control { resize: vertical; min-height: 140px; }

    /* row spacing */
    .form-row { margin-bottom: 1.4rem; }

    /* submit button */
    .btn-submit {
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .85rem 2.4rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background .2s, transform .15s;
    }

    .btn-submit::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.15);
      opacity: 0;
      transition: opacity .2s;
    }

    .btn-submit:hover {
      background: var(--accent2);
      transform: translateY(-1px);
    }
    .btn-submit:hover::after { opacity: 1; }
    .btn-submit:active { transform: translateY(0); }

    .form-note {
      font-size: .75rem;
      color: var(--muted);
      margin-top: 1.2rem;
    }

    @media (max-width: 576px) {
      .form-card { padding: 2rem 1.5rem; }
      .form-title { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<div class="form-wrapper">
  <div class="form-card">

    <div class="form-header">
      <p class="eyebrow">Stupite u kontakt</p>
      <h1 class="form-title">Kontaktirajte <span>Nas</span></h1>
      <div class="divider"></div>
    </div>

    <form action="#" method="GET" novalidate>

      <div class="row form-row g-3">
        <div class="col-12 col-md-6">
          <label for="ime" class="form-label">Ime i prezime</label>
          <input
            type="text"
            id="ime"
            name="ime"
            class="form-control"
            placeholder="Npr. Ivan Horvat"
            required/>
        </div>
        <div class="col-12 col-md-6">
          <label for="email" class="form-label">Email adresa</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="ivan@example.com"
            required/>
        </div>
      </div>


      <div class="row form-row g-3">
        <div class="col-12">
          <label for="poruka" class="form-label">Vaša poruka</label>
          <textarea
            id="poruka"
            name="poruka"
            class="form-control"
            placeholder="Napišite svoju poruku ovdje..."
            required
          ></textarea>
        </div>
      </div>

      <div class="d-flex align-items-center gap-4 flex-wrap">
        <button type="submit" class="btn-submit">Pošalji Poruku</button>
        <p class="form-note mb-0">Odgovaramo u roku od 24 sata.</p>
      </div>

    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
