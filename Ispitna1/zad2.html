<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @media (min-width: 1024px){
            .container{
                height: 98vh;
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 5fr;
                grid-template-rows: 1fr 3fr 1fr;
                gap: 10px;
            }
            .header{
                grid-area: 1 / 1 / 2 / 3;
                border: 1px solid purple;
                border-radius: 5px;
                background-color: violet;
                text-align: center;
                font-size: 30px;
            }
            .sidebar{
                grid-area: 2 / 1 / 3 / 2;
                border: 1px solid green;
                border-radius: 5px;
                background-color: lightgreen;
                text-align: center;
                font-size: 30px;
            }
            .content{
                grid-area: 2 / 2 / 3 / 3;
                border: 1px solid yellow;
                border-radius: 5px;
                background-color: lightyellow;
                text-align: center;
                font-size: 30px;
            }
            .footer{
                grid-area: 3 / 1 / 4 / 3;
                border: 1px solid blue;
                border-radius: 5px;
                background-color: lightblue;
                text-align: center;
                font-size: 30px;
            }
        }
        @media (max-width: 768px){
            .container{
                height: 98vh;
                width: 100%;
                display: grid;
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr 2fr 1fr;
                gap: 10px;
            }
            .header{
                grid-area: 1 / 1 / 2 / 2;
                border: 1px solid purple;
                border-radius: 5px;
                background-color: violet;
                text-align: center;
                font-size: 30px;
            }
            .sidebar{
                grid-area: 2 / 1 / 3 / 2;
                border: 1px solid green;
                border-radius: 5px;
                background-color: lightgreen;
                text-align: center;
                font-size: 30px;
            }
            .content{
                grid-area: 3 / 1 / 4 / 2;
                border: 1px solid yellow;
                border-radius: 5px;
                background-color: lightyellow;
                text-align: center;
                font-size: 30px;
            }
            .footer{
                grid-area: 4 / 1 / 5 / 2;
                border: 1px solid blue;
                border-radius: 5px;
                background-color: lightblue;
                text-align: center;
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="content">Main Content</div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
